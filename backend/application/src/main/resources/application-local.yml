spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:app}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD:app}
    driver-class-name: org.postgresql.Driver
    # The local database is yours alone, so the pool can run at full baseline.
    hikari:
      maximum-pool-size: 50
      minimum-idle: 1
      idle-timeout: 60000
      connection-timeout: 2000
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    persist-authorization: true

# Defaults are the non-prod Clerk instance so docker-compose runs without any
# environment setup. The published app overrides these through PRD_ variables.
app:
  auth:
    allowed-email-domain: ${AUTH_ALLOWED_EMAIL_DOMAIN:aidigital.com}
    publishable-key: ${CLERK_PUBLISHABLE_KEY:pk_test_bGl2aW5nLWluc2VjdC02MC5jbGVyay5hY2NvdW50cy5kZXYk}
    authorized-parties: ${AUTH_AUTHORIZED_PARTIES:http://localhost:5173,http://localhost:5000,http://localhost:8080}
    sso:
      issuer-uri: ${AUTH_ISSUER_URI:https://living-insect-60.clerk.accounts.dev}
      jwk-set-uri: ${AUTH_JWKS_URI:https://living-insect-60.clerk.accounts.dev/.well-known/jwks.json}
      audience: ${AUTH_AUDIENCE:}
