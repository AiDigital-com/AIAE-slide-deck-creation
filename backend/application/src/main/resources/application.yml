# Base configuration. Profile overrides: application-replit.yml for the Replit
# workspace and Reserved VM, application-local.yml for docker-compose.
#
# !!! DO NOT add `spring.security.oauth2.resourceserver.jwt.*` properties here !!!
# Spring Boot's OAuth2 auto-config triggers on ANY of those properties (even
# empty strings) and tries to fetch JWKS from the empty URL at startup.
# SecurityConfig provides the JwtDecoder bean directly; that's enough to
# satisfy the resource-server chain without poking auto-config.

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:app}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD:app}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:50}
      minimum-idle: 1
      idle-timeout: 60000
      connection-timeout: 2000
      auto-commit: false
  jta:
    enabled: false
  cache:
    type: jcache
  application:
    name: ${APP_SERVICE_NAME:strategyplanning}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database: postgresql
    properties:
      hibernate:
        generate_statistics: false
        jdbc:
          time_zone: UTC
          batch_size: 50
          fetch_size: 100
        query:
          in_clause_parameter_padding: true
          immutable_entity_update_query_handling_mode: exception
          mutation_strategy:
            global_temporary:
              create_tables: false
              drop_tables: false
        criteria:
          literal_handling_mode: bind
        default_batch_fetch_size: 300
        # Requires ehcache.xml on the classpath. Every cached query region and
        # entity class needs a matching alias there, or startup fails
        # (missing_cache_strategy: fail).
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region_prefix: hibernate-cache
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
        javax:
          cache:
            uri: ehcache.xml
            missing_cache_strategy: fail
            provider: org.ehcache.jsr107.EhcacheCachingProvider
      jakarta:
        persistence:
          sharedCache:
            mode: ENABLE_SELECTIVE
  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.xml
  task:
    scheduling:
      pool:
        size: 4
  servlet:
    multipart:
      # Case Study auto-draft uploads — up to 10 source documents per request.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:15MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:60MB}

server:
  port: ${PORT:8080}
  # Replit + Reserved VM terminate TLS at the edge and forward X-Forwarded-*
  # headers. `framework` makes Spring honour them so absolute URLs / Swagger /
  # CORS resolve to the public https origin rather than http://localhost:5000.
  forward-headers-strategy: framework
  servlet:
    # Empty means Spring serves /api/v1/... at the root. If a deployment sets a
    # prefix, APP_CONTEXT_PATH must match in docker-compose.yml too, or the
    # healthcheck and the nginx /api proxy break.
    context-path: ${APP_CONTEXT_PATH:}

management:
  endpoints:
    web:
      exposure:
        # Operational endpoints only. env/configprops/beans combined with
        # show-values leak DB credentials to any authenticated principal.
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: when-authorized
    env:
      show-values: never
    configprops:
      show-values: never

springdoc:
  swagger-ui:
    url: /api/v1/specs/openapi.yaml
    persist-authorization: true

logging:
  level:
    root: INFO
    org.zalando.logbook: TRACE   # TRACE on the logbook logger → emit req/resp lines

app:
  category-analysis:
    # AI drafting engine — blank key means "AI not connected" in the UI.
    openai-api-key: ${OPENAI_API_KEY:}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    openai-model: ${OPENAI_MODEL:gpt-4o}
    # Master Standard Category Analysis Google Slides template.
    template-presentation-id: ${CATEGORY_ANALYSIS_TEMPLATE_ID:164QKu8KTgpxYYGtX9lGXp-M_5IHXMm-oiGromJtfI3k}
    # Clerk secret key — used to fetch the user's Google OAuth token for Drive/Slides.
    clerk-secret-key: ${CLERK_SECRET_KEY:}
    # Friendly, on-vertical slide images generated at deck-creation time.
    # gpt-image-1 returns image bytes (base64); the backend hosts them briefly at
    # /public/slide-images/{token} so Google Slides can fetch them.
    openai-image-model: ${OPENAI_IMAGE_MODEL:gpt-image-1}
    openai-image-size: ${OPENAI_IMAGE_SIZE:1024x1024}
    openai-image-quality: ${OPENAI_IMAGE_QUALITY:medium}
    # transparent = cutout-style PNGs (subject isolated, no background) — mirrors the
    # generate-in-Slides-then-remove-background workflow.
    openai-image-background: ${OPENAI_IMAGE_BACKGROUND:transparent}
  cache:
    warmup-enabled: false
  cache-management:
    poll-interval-ms: 15000
    initial-delay-ms: 15000
    batch-size: 500
    max-batches-per-poll: 20
    cleanup-enabled: false
    retention: 7d
    cleanup-cron: "0 30 1 * * *"
    verify-registry: false
  auth:
    allowed-email-domain: ${AUTH_ALLOWED_EMAIL_DOMAIN:aidigital.com}
    publishable-key: ${CLERK_PUBLISHABLE_KEY:}
    # Comma-separated EXACT trusted browser origins for the JWT azp claim (required).
    # Never a publishable key. Blank values fail startup (AuthStartupValidator).
    authorized-parties: ${AUTH_AUTHORIZED_PARTIES:}
    # Clerk SSO is the ONLY auth mode. Issuer/JWKS derive from publishable-key
    # when AUTH_ISSUER_URI / AUTH_JWKS_URI are blank.
    sso:
      issuer-uri: ${AUTH_ISSUER_URI:}
      jwk-set-uri: ${AUTH_JWKS_URI:}
      audience: ${AUTH_AUDIENCE:}
  security:
    cors:
      allowed-origins: "${APP_SECURITY_CORS_ALLOWED_ORIGINS:https://*.replit.dev,https://*.repl.co,http://localhost:5173,http://localhost:5000}"
      max-age-seconds: ${APP_SECURITY_CORS_MAX_AGE_SECONDS:3600}
    # Clerk's own Frontend API origin is appended to script-src/frame-src by SecurityConfig,
    # decoded from the publishable key, so it is pinned to this instance rather than the
    # *.clerk.accounts.dev wildcard. Do not add the wildcard back here.
    csp:
      default-src: "${APP_SECURITY_CSP_DEFAULT_SRC:'self'}"
      frame-ancestors: "${APP_SECURITY_CSP_FRAME_ANCESTORS:'self' https://*.replit.dev https://*.repl.co}"
      script-src: "${APP_SECURITY_CSP_SCRIPT_SRC:'self' 'unsafe-inline' https://challenges.cloudflare.com}"
      worker-src: "${APP_SECURITY_CSP_WORKER_SRC:'self' blob:}"
      frame-src: "${APP_SECURITY_CSP_FRAME_SRC:'self' https://challenges.cloudflare.com}"
      style-src: "${APP_SECURITY_CSP_STYLE_SRC:'self' 'unsafe-inline' https://fonts.googleapis.com}"
      img-src: "${APP_SECURITY_CSP_IMG_SRC:'self' data: https:}"
      connect-src: "${APP_SECURITY_CSP_CONNECT_SRC:'self' https:}"
      font-src: "${APP_SECURITY_CSP_FONT_SRC:'self' data: https://fonts.gstatic.com}"
  # Shared outbound HTTP pool for third-party clients built by PooledRestClientFactory.
  external:
    http:
      connect-timeout: ${APP_EXTERNAL_HTTP_CONNECT_TIMEOUT:5s}
      response-timeout: ${APP_EXTERNAL_HTTP_RESPONSE_TIMEOUT:30s}
      connection-request-timeout: ${APP_EXTERNAL_HTTP_CONNECTION_REQUEST_TIMEOUT:5s}
      max-total-connections: ${APP_EXTERNAL_HTTP_MAX_TOTAL_CONNECTIONS:50}
      max-connections-per-route: ${APP_EXTERNAL_HTTP_MAX_CONNECTIONS_PER_ROUTE:10}
      keep-alive-duration: 60s
      idle-eviction-duration: 30s
  # Logbook HTTP req/resp logging — bound by LogbookConfig. Defaults inline
  # in LogbookProperties mirror the canonical rules; override here per-app.
  # See observability/logbook-http-logging-rules.md.
  logbook:
    censored-replacement: XXX
    headers-to-censor: [ Authorization, Cookie, Set-Cookie, X-API-Key, AccessKey, Proxy-Authorization ]
    json-fields-to-censor: [ ".*password.*", ".*token.*", ".*secret.*", ".*key.*", ".*credential.*", ".*authorization.*", privateKey, clientSecret, serviceAccount ]
    excluded:
      "/**/actuator/**": [ GET ]
      "/**/swagger-ui/**": [ GET ]
      "/**/specs/**": [ GET ]
      "/health": [ GET ]
      "/**": [ OPTIONS ]
  case-study:
    template-url: ${CASE_STUDY_TEMPLATE_URL:https://docs.google.com/presentation/d/1ET3mz7ZVvbn4EDSHnpOcuCw_s5Kd3g717VPq5pnADXw/edit}
    # Master template copied into the user's Drive for each generated case study deck.
    template-presentation-id: ${CASE_STUDY_TEMPLATE_PRESENTATION_ID:1ET3mz7ZVvbn4EDSHnpOcuCw_s5Kd3g717VPq5pnADXw}
    # Clerk secret key — used to fetch the user's Google OAuth token for Drive/Slides.
    clerk-secret-key: ${CLERK_SECRET_KEY:}
    # AI auto-draft from uploaded source documents — blank key means "AI not connected".
    openai-api-key: ${OPENAI_API_KEY:}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    openai-model: ${OPENAI_MODEL:gpt-4o}
    # Hard cap on source documents per auto-draft request.
    max-source-files: ${CASE_STUDY_MAX_SOURCE_FILES:10}
  rfp-outline:
    template-url: ${RFP_OUTLINE_TEMPLATE_URL:}
    # Master template copied into the user's Drive for each generated RFP outline doc.
    # Engineering/Sheldon must create this Google Doc template with {{token}} placeholders
    # (see RfpOutlineTemplateTokens) and set its file ID here before Doc export will work.
    template-doc-id: ${RFP_OUTLINE_TEMPLATE_DOC_ID:}
    # Clerk secret key — used to fetch the user's Google OAuth token for Drive/Docs.
    clerk-secret-key: ${CLERK_SECRET_KEY:}
    # AI auto-draft from uploaded source documents — blank key means "AI not connected".
    openai-api-key: ${OPENAI_API_KEY:}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    openai-model: ${OPENAI_MODEL:gpt-4o}
    # Hard cap on source documents per auto-draft request.
    max-source-files: ${RFP_OUTLINE_MAX_SOURCE_FILES:10}
  rnd-request:
    # Buy amounts at or above this USD threshold escalate straight to RnD.
    escalation-threshold: ${RND_ESCALATION_THRESHOLD:100000}
    # Capability search sources — blank means "not connected" (triage still works).
    slite-api-key: ${SLITE_API_KEY:}
    asana-access-token: ${ASANA_ACCESS_TOKEN:}
  usage-logging:
    enabled: ${USAGE_LOGGING_ENABLED:true}
    # Must be non-empty when enabled=true, or the aspect silently binds
    # NoOpUsageLogger and no events are recorded. Falls back to
    # spring.application.name so an unset env var cannot cause that.
    service-name: ${USAGE_LOG_SERVICE_NAME:${spring.application.name}}
    environment: ${USAGE_LOG_ENVIRONMENT:dev}
    executor-core-pool-size: ${USAGE_LOG_EXECUTOR_CORE_POOL_SIZE:1}
    executor-max-pool-size: ${USAGE_LOG_EXECUTOR_MAX_POOL_SIZE:2}
    executor-queue-capacity: ${USAGE_LOG_EXECUTOR_QUEUE_CAPACITY:200}
    max-error-message-length: ${USAGE_LOG_MAX_ERROR_MESSAGE_LENGTH:500}
    max-user-agent-length: ${USAGE_LOG_MAX_USER_AGENT_LENGTH:500}
