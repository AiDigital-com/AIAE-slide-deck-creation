          allOf:
            - $ref: "#/components/schemas/RndDecisionV1"
        capabilitySummary:
          type: string
          nullable: true
          description: Result of the capability search across connected knowledge sources (Slite, Asana). Reports "not connected" when integrations are not configured.
        responseDraft:
          type: string
          nullable: true
          description: Drafted output — an RnD submission summary when escalated, otherwise a positive relay-ready workaround response.
        status:
          description: Lifecycle state of the request's triage run.
          allOf:
            - $ref: "#/components/schemas/GenerationStatusV1"
        createdAt:
          type: string
          format: date-time
          description: UTC timestamp when the RnD request was created.

    CreateRndRequestRequestV1:
      type: object
      additionalProperties: false
      description: Request payload for creating and triaging a new RnD request. Title and buy amount are required.
      required: [ title, buyAmount ]
      properties:
        title:
          type: string
          maxLength: 255
          minLength: 1
          description: Short title of the requested feature or product capability. Must not be blank.
        requesterTeam:
          type: string
          maxLength: 255
          nullable: true
          description: Growth team or requester the ask came from.
        requestDetails:
          type: string
          maxLength: 5000
          nullable: true
          description: Full description of the feature/product request.
        capabilityNotes:
          type: string
          maxLength: 5000
          nullable: true
          description: Manual notes about existing capabilities or possible workarounds.
        buyAmount:
          type: number
          description: Deal size ("the buy") in USD. Must be zero or greater.
          minimum: 0

    AppValidationExceptionResponseV1:
      type: object
      additionalProperties: false
      description: Representation of validation exception occurred in REST API format.
      required: [ errors, timestamp, correlationId ]
      properties:
        errors:
          description: The list of validation errors occurred.
          type: array
          items:
            $ref: "#/components/schemas/FieldToErrorResponseV1"
        timestamp:
          type: string
          format: date-time
          description: The timestamp exception occurred.
        correlationId:
          type: string
          description: The log stream UUID.

    FieldToErrorResponseV1:
      type: object
      additionalProperties: false
      description: Representation of validation error bound to a field or semantic request part.
      required: [ code, field, error ]
      properties:
        code: { type: string, description: "The code of validation error occurred." }
        field: { type: string, description: "The field or semantic request part not passed validation." }
        error: { type: string, description: "The validation error occurred." }

    AppApiExceptionResponseV1:
      type: object
      additionalProperties: false
      description: Representation of exception occurred in REST API format.
      required: [ code, message, timestamp, correlationId ]
      properties:
        code: { type: string, description: "The code of exception occurred." }
        message: { type: string, description: "The message of exception occurred." }
        timestamp: { type: string, format: date-time, description: "The timestamp exception occurred." }
        correlationId: { type: string, description: "The log stream UUID." }
