openapi: 3.0.3
info:
  title: Strategy & Planning API
  version: 0.1.0
  description: |
    Strategy & Planning toolkit API. Provides endpoints for the Case Study Builder,
    Category Analysis Builder, and RFP Outline Generator tools. Authentication via Clerk SSO (Bearer JWT).

servers:
  - url: /api/v1
    description: V1 base path (DOCUMENTATION ONLY — the openapi-generator-maven-plugin
      does NOT prepend this to generated Spring routes. Path keys below carry the
      `/api/v1/` prefix verbatim. See canonical-openapi-rules.md → "/api/v1 prefix").

security:
  - bearerAuth: [ ]

tags:
  - name: auth
    description: Authentication bootstrap
  - name: CaseStudies
    description: Case Study Builder — create and manage case studies for Google Slides generation
  - name: CategoryAnalyses
    description: Category Analysis Builder — create and manage 3-5 slide category analyses for Google Slides generation
  - name: RndRequests
    description: RnD Request Triage — triage growth-team feature/product requests by deal size and draft a relay-ready response
  - name: RfpOutlines
    description: RFP Outline Generator — draft a point-of-view and response deck outline from an uploaded RFP, and export it to Google Docs

paths:
  /api/v1/auth/me:
    get:
      tags: [ auth ]
      operationId: getCurrentUser
      summary: Returns the authenticated user (Clerk SSO)
      description: Returns the Clerk-authenticated user identity used by the SPA bootstrap.
      responses:
        "200":
          description: Authenticated user payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserV1"
              examples:
                demo:
                  value:
                    user_id: "user_123"
                    email: "demo-user@example.com"
                    full_name: "Demo User"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while resolving authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

  /api/v1/case-studies:
    get:
      tags: [ CaseStudies ]
      operationId: listCaseStudies
      summary: List all case studies for the authenticated user
      description: Returns all case studies created by the authenticated user, ordered by creation date descending.
      security: [ { bearerAuth: [ ] } ]
      responses:
        "200":
          description: List of case study summaries for the authenticated user.
          content:
            application/json:
              schema:
                type: array
                description: Ordered list of case study summaries.
                items:
                  $ref: "#/components/schemas/CaseStudySummaryV1"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while listing case studies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

    post:
      tags: [ CaseStudies ]
      operationId: createCaseStudy
      summary: Create a new case study and generate its Google Slides deck
      description: |
        Creates a new case study with the provided form fields and immediately generates a Google
        Slides deck by copying the tokenized master template into the user's Drive and filling all
        template tokens. Requires the user to be signed in with Google (via Clerk) with Drive and
        Slides access. On success the record is persisted with status GENERATED and the deck URL
        is returned in slidesUrl.
      security: [ { bearerAuth: [ ] } ]
      requestBody:
        required: true
        description: Case study form fields. Title is required; all other fields are optional pre-fill.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseStudyRequestV1"
      responses:
        "201":
          description: Case study created and its Google Slides deck generated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseStudyV1"
        "400":
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppValidationExceptionResponseV1"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while creating the case study.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "502":
          description: >-
            Google deck generation failed — the user is not connected to Google, has not granted
            Drive & Slides access, or a Google API call failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

  /api/v1/case-studies/drafts:
    post:
      tags: [ CaseStudies ]
      operationId: draftCaseStudy
      summary: AI-draft case study fields from uploaded source documents
      description: |
        Accepts up to 10 source documents (PDF, PowerPoint, Excel, or CSV), extracts their
        readable content — including tabular data from Excel workbooks — and uses the AI
        drafting engine to pre-fill every case study form field. The result is meant to be
        reviewed and edited by the user before submission; metrics and quotes are AI-extracted
        and must be verified against the source documents.
      security: [ { bearerAuth: [ ] } ]
      requestBody:
        required: true
        description: Source documents to draft from. Between 1 and 10 files.
        content:
          multipart/form-data:
            schema:
              type: object
              description: Multipart payload carrying the uploaded source documents.
              required: [ files ]
              properties:
                files:
                  type: array
                  description: Uploaded source documents (PDF, PPTX, PPT, XLSX, XLS, or CSV). Maximum 10 files.
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: binary
                    description: One uploaded source document.
      responses:
        "200":
          description: Drafted case study fields for review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseStudyDraftV1"
        "400":
          description: Request validation failed (no files, more than 10 files, or an unsupported/unreadable file).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "502":
          description: AI drafting engine not configured or the drafting call failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while drafting the case study.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

  /api/v1/case-studies/{id}:
    get:
      tags: [ CaseStudies ]
      operationId: getCaseStudy
      summary: Get a case study by ID
      description: Returns the full detail of a case study belonging to the authenticated user.
      security: [ { bearerAuth: [ ] } ]
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the case study.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Case study detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseStudyV1"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "404":
          description: Case study not found or does not belong to the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while retrieving the case study.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

  /api/v1/rfp-outlines:
    get:
      tags: [ RfpOutlines ]
      operationId: listRfpOutlines
      summary: List all RFP outlines for the authenticated user
      description: Returns all RFP outlines created by the authenticated user, ordered by creation date descending.
      security: [ { bearerAuth: [ ] } ]
      responses:
        "200":
          description: List of RFP outline summaries for the authenticated user.
          content:
            application/json:
              schema:
                type: array
                description: Ordered list of RFP outline summaries.
                items:
                  $ref: "#/components/schemas/RfpOutlineSummaryV1"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while listing RFP outlines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

    post:
      tags: [ RfpOutlines ]
      operationId: createRfpOutline
      summary: Create a new RFP outline and export it to Google Docs
      description: |
        Creates a new RFP outline with the provided reviewed fields and immediately generates a Google Doc
        by copying the tokenized master template into the user's Drive and filling all template
        tokens. Requires the user to be signed in with Google (via Clerk) with Drive and Docs
        access. On success the record is persisted with status SAVED and the doc URL is returned
        in docUrl.
      security: [ { bearerAuth: [ ] } ]
      requestBody:
        required: true
        description: RFP outline fields. Title is required; all other fields are optional pre-fill.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRfpOutlineRequestV1"
      responses:
        "201":
          description: RFP outline created and its Google Doc generated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfpOutlineV1"
        "400":
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppValidationExceptionResponseV1"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while creating the RFP outline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "502":
          description: >-
            Google doc generation failed — the user is not connected to Google, has not granted
            Drive & Docs access, or a Google API call failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

  /api/v1/rfp-outlines/drafts:
    post:
      tags: [ RfpOutlines ]
      operationId: draftRfpOutline
      summary: AI-draft a POV and deck outline from an uploaded RFP
      description: |
        Accepts up to 10 source documents (PDF, DOCX, DOC, PPTX, PPT, XLSX, XLS, or CSV), extracts
        their readable content, and uses the AI drafting engine — together with optional
        supplementary notes — to draft a succinct POV (challenge, opportunity, solution, outcome)
        and a slide-by-slide response deck outline. The result is meant to be reviewed and edited
        by the user before submission.
      security: [ { bearerAuth: [ ] } ]
      requestBody:
        required: true
        description: Source documents to draft from (1-10 files), plus optional supplementary notes.
        content:
          multipart/form-data:
            schema:
              type: object
              description: Multipart payload carrying the uploaded RFP documents and optional notes.
              required: [ files ]
              properties:
                files:
                  type: array
                  description: Uploaded RFP documents (PDF, DOCX, DOC, PPTX, PPT, XLSX, XLS, or CSV). Maximum 10 files.
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: binary
                    description: One uploaded RFP document.
                notes:
                  type: string
                  description: Optional free-text supplementary context alongside the uploaded RFP.
      responses:
        "200":
          description: Drafted POV narrative and deck outline for review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfpOutlineDraftV1"
        "400":
          description: Request validation failed (no files, more than 10 files, or an unsupported/unreadable file).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "502":
          description: AI drafting engine not configured or the drafting call failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while drafting the RFP outline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

  /api/v1/rfp-outlines/{id}:
    get:
      tags: [ RfpOutlines ]
      operationId: getRfpOutline
      summary: Get an RFP outline by ID
      description: Returns the full detail of an RFP outline belonging to the authenticated user.
      security: [ { bearerAuth: [ ] } ]
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the RFP outline.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: RFP outline detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RfpOutlineV1"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "404":
          description: RFP outline not found or does not belong to the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while retrieving the RFP outline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

  /api/v1/category-analyses:
    get:
      tags: [ CategoryAnalyses ]
      operationId: listCategoryAnalyses
      summary: List all category analyses for the authenticated user
      description: Returns all category analyses created by the authenticated user, ordered by creation date descending.
      security: [ { bearerAuth: [ ] } ]
      responses:
        "200":
          description: List of category analysis summaries for the authenticated user.
          content:
            application/json:
              schema:
                type: array
                description: Ordered list of category analysis summaries.
                items:
                  $ref: "#/components/schemas/CategoryAnalysisSummaryV1"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while listing category analyses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

    post:
      tags: [ CategoryAnalyses ]
      operationId: createCategoryAnalysis
      summary: Create and submit a new category analysis
      description: |
        Creates a new category analysis with the provided form fields.
        The record is persisted with status SUBMITTED, indicating it is ready for Google Slides
        generation once OAuth is configured. Outputs a 3-5 slide deck narrative.
      security: [ { bearerAuth: [ ] } ]
      requestBody:
        required: true
        description: Category analysis form fields. Title is required; all other fields are optional.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryAnalysisRequestV1"
      responses:
        "201":
          description: Category analysis created and submitted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryAnalysisV1"
        "400":
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppValidationExceptionResponseV1"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while creating the category analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

  /api/v1/category-analyses/{id}:
    get:
      tags: [ CategoryAnalyses ]
      operationId: getCategoryAnalysis
      summary: Get a category analysis by ID
      description: Returns the full detail of a category analysis belonging to the authenticated user.
      security: [ { bearerAuth: [ ] } ]
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the category analysis.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Category analysis detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryAnalysisV1"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "404":
          description: Category analysis not found or does not belong to the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while retrieving the category analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

  /api/v1/category-analyses/standard-connections:
    get:
      tags: [ CategoryAnalyses ]
      operationId: getStandardConnections
      summary: Report connection status for the Standard Category Analysis generator
      description: |
        Reports whether the AI drafting engine is configured (OpenAI API key present) and whether
        the authenticated user's Google account grants Drive/Slides access via Clerk SSO.
      security: [ { bearerAuth: [ ] } ]
      responses:
        "200":
          description: Connection status for the standard deck generator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardConnectionsV1"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while checking connections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

  /api/v1/category-analyses/standard-drafts:
    post:
      tags: [ CategoryAnalyses ]
      operationId: draftStandardCategoryAnalysis
      summary: AI-draft all fields of a Standard Category Analysis
      description: |
        Uses the AI drafting engine to produce every text field of the Standard Category Analysis
        template (5 slides, ~50 fields) from a short brief. The result is
        meant to be reviewed and edited by the user before deck creation. Stats and sources are
        AI-drafted and must be verified before client use.
      security: [ { bearerAuth: [ ] } ]
      requestBody:
        required: true
        description: Short brief for the analysis. Category and client name are required.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandardDraftRequestV1"
      responses:
        "200":
          description: Complete drafted field set for review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardDraftV1"
        "400":
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppValidationExceptionResponseV1"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "502":
          description: AI drafting engine not configured or the drafting call failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while drafting the analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

  /api/v1/category-analyses/standard-drafts/slide:
    post:
      tags: [ CategoryAnalyses ]
      operationId: redraftStandardCategorySlide
      summary: AI-redraft the fields of a single slide of a Standard Category Analysis
      description: |
        Re-drafts only the text fields of one slide of the
        Standard Category Analysis template, using the original brief plus an optional per-slide
        guidance note. The current values of the whole deck are supplied as context so the redraft
        stays consistent with the slides the user is keeping. Only the returned slide's fields
        should replace existing values; edits on other slides are preserved by the caller. Stats
        and sources are AI-drafted and must be verified before client use.
      security: [ { bearerAuth: [ ] } ]
      requestBody:
        required: true
        description: Brief, slide number, optional per-slide note, and current deck values for context.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedraftSlideRequestV1"
      responses:
        "200":
          description: Redrafted field set for the requested slide.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardDraftV1"
        "400":
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppValidationExceptionResponseV1"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "502":
          description: AI drafting engine not configured or the drafting call failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while redrafting the slide.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

  /api/v1/category-analyses/standard-decks:
    post:
      tags: [ CategoryAnalyses ]
      operationId: createStandardCategoryDeck
      summary: Create the Standard Category Analysis deck in the user's Google Slides
      description: |
        Copies the master Standard Category Analysis template into the authenticated user's own
        Google Drive, fills every template token with the reviewed field values, replaces the
        image placeholders on slides 1-4 with friendly, on-vertical generated photographs, and
        returns the new presentation's URL. Requires the user's Google account (via Clerk SSO) to
        grant Drive and Slides access.
      security: [ { bearerAuth: [ ] } ]
      requestBody:
        required: true
        description: Reviewed field values for deck creation.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStandardDeckRequestV1"
      responses:
        "201":
          description: Deck created in the user's Google Drive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryAnalysisV1"
        "400":
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppValidationExceptionResponseV1"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "502":
          description: Google Drive/Slides access not granted or the Google API call failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while creating the deck.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

  /api/v1/rnd-requests:
    get:
      tags: [ RndRequests ]
      operationId: listRndRequests
      summary: List all RnD requests for the authenticated user
      description: Returns all triaged RnD requests created by the authenticated user, ordered by creation date descending.
      security: [ { bearerAuth: [ ] } ]
      responses:
        "200":
          description: List of RnD request summaries for the authenticated user.
          content:
            application/json:
              schema:
                type: array
                description: Ordered list of RnD request summaries.
                items:
                  $ref: "#/components/schemas/RndRequestSummaryV1"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while listing RnD requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

    post:
      tags: [ RndRequests ]
      operationId: createRndRequest
      summary: Create and triage a new RnD request
      description: |
        Creates a new RnD request and triages it immediately based on the deal size ("the buy").
        When the buy meets or exceeds the escalation threshold (default $100,000) the request is
        marked ESCALATE_TO_RND and a drafted RnD submission summary is returned. Otherwise it is
        marked WORKAROUND and a positive, relay-ready workaround response is drafted — the tool
        never produces a flat "no". Capability search across Slite/Asana is included in the
        capability summary when those integrations are connected; until then the summary reports
        they are not connected.
      security: [ { bearerAuth: [ ] } ]
      requestBody:
        required: true
        description: RnD request fields. Title and buy amount are required.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRndRequestRequestV1"
      responses:
        "201":
          description: RnD request created and triaged successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RndRequestV1"
        "400":
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppValidationExceptionResponseV1"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while creating the RnD request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

  /api/v1/rnd-requests/{id}:
    get:
      tags: [ RndRequests ]
      operationId: getRndRequest
      summary: Get an RnD request by ID
      description: Returns the full detail of a triaged RnD request belonging to the authenticated user.
      security: [ { bearerAuth: [ ] } ]
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the RnD request.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: RnD request detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RndRequestV1"
        "401":
          description: The authorization token not provided or expired.
        "403":
          description: The authorization token not correct or user not authorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "404":
          description: RnD request not found or does not belong to the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"
        "500":
          description: Exception occurred while retrieving the RnD request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppApiExceptionResponseV1"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    GenerationStatusV1:
      type: string
      description: |
        Lifecycle status of a generated document.
        DRAFT — saved but not yet submitted for generation.
        SUBMITTED — submitted for Google Slides generation.
        GENERATED — Google Slides deck created in the user's Drive.
      enum: [ DRAFT, SUBMITTED, GENERATED ]

    GoogleConnectionStatusV1:
      type: string
      description: |
        State of the caller's Google connection for Drive/Slides work.
        NOT_CONNECTED — the user has not signed in with Google.
        MISSING_SCOPES — signed in with Google, but the Drive/Slides scopes were not granted.
        CONNECTED — Drive & Slides access granted.
      enum: [ NOT_CONNECTED, MISSING_SCOPES, CONNECTED ]

    UserV1:
      type: object
      additionalProperties: false
      description: Authenticated user identity projected from Clerk JWT claims.
      required: [ user_id, email ]
      properties:
        user_id: { type: string, description: "Clerk user id (sub/user_id claim)." }
        email: { type: string, format: email, description: "Primary email address verified by Clerk." }
        full_name: { type: string, description: "Display name assembled from Clerk profile claims." }

