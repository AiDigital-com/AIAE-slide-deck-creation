      type: object
      additionalProperties: false
      description: Short brief used to AI-draft a Standard Category Analysis.
      required: [ category, clientName, clientWebsite ]
      properties:
        category:
          type: string
          maxLength: 255
          minLength: 1
          description: Market category or industry being analysed (e.g. "Regional Travel", "Western Boots").
        clientName:
          type: string
          maxLength: 255
          minLength: 1
          description: Client the analysis is prepared for (e.g. "Alberta Boot").
        clientWebsite:
          type: string
          maxLength: 2048
          minLength: 1
          description: >-
            Client's website URL (e.g. "https://albertaboot.com"). The builder reviews the
            site to understand the client's business focus and confirm the deck aligns with it.
        storyTheme:
          type: string
          maxLength: 500
          nullable: true
          description: >-
            Optional narrative theme to guide the arc of the deck (e.g. "how adopting CTV can
            increase market awareness"). Emphasised across slides while still covering broader trends.
        guidanceNotes:
          type: string
          maxLength: 5000
          nullable: true
          description: Optional focus areas, angles, or constraints to steer the draft.

    StandardDraftFieldV1:
      type: object
      additionalProperties: false
      description: One drafted template field with its slide grouping metadata.
      required: [ key, label, slideNumber, value ]
      properties:
        key:
          type: string
          description: Stable template token key (e.g. "trends_headline").
        label:
          type: string
          description: Human-readable label shown in the review UI.
        slideNumber:
          type: integer
          format: int32
          description: Slide the field belongs to (1-5).
        value:
          type: string
          description: Drafted text value; editable by the user before deck creation.

    DraftAlignmentV1:
      type: object
      additionalProperties: false
      description: Website-based confirmation that the drafted deck matches the client's business focus.
      required: [ confirmed, matches, message ]
      properties:
        clientBusinessFocus:
          type: string
          nullable: true
          description: Short summary of the client's core business focus, derived from their website.
        confirmed:
          type: boolean
          description: >-
            Whether the client website could be read to actually check alignment. When false the
            match result is unverified and the message explains why.
        matches:
          type: boolean
          description: >-
            Whether the analysed category clearly fits the client's business focus. Only meaningful
            when confirmed is true.
        message:
          type: string
          description: Human-readable confirmation or warning about topic/business alignment.

    StandardDraftV1:
      type: object
      additionalProperties: false
      description: Complete AI-drafted field set for the Standard Category Analysis template.
      required: [ fields, alignment ]
      properties:
        fields:
          type: array
          description: All drafted template fields ordered by slide.
          items:
            $ref: "#/components/schemas/StandardDraftFieldV1"
        alignment:
          description: How closely the draft matched the requested category and client.
          allOf:
            - $ref: "#/components/schemas/DraftAlignmentV1"

    RedraftSlideRequestV1:
      type: object
      additionalProperties: false
      description: Brief plus current deck context used to AI-redraft a single slide of a Standard Category Analysis.
      required: [ category, clientName, slideNumber, currentFields ]
      properties:
        category:
          type: string
          maxLength: 255
          minLength: 1
          description: Market category or industry being analysed (e.g. "Regional Travel", "Western Boots").
        clientName:
          type: string
          maxLength: 255
          minLength: 1
          description: Client the analysis is prepared for (e.g. "Alberta Boot").
        guidanceNotes:
          type: string
          maxLength: 5000
          nullable: true
          description: Original brief focus areas or constraints, may be null.
        slideNumber:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          description: Slide to redraft (1-5).
        slideNote:
          type: string
          maxLength: 5000
          nullable: true
          description: Optional guidance for this redraft (e.g. "make it more data-driven", "focus on Gen Z").
        currentFields:
          type: array
          maxItems: 200
          description: Current values for every template field of the deck, supplied as context so the redraft stays consistent with slides being kept.
          items:
            $ref: "#/components/schemas/StandardFieldValueV1"

    StandardFieldValueV1:
      type: object
      additionalProperties: false
      description: A reviewed field value keyed by its template token.
      required: [ key, value ]
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 255
          description: Stable template token key.
        value:
          type: string
          maxLength: 20000
          description: Final reviewed text value.

    CreateStandardDeckRequestV1:
      type: object
      additionalProperties: false
      description: Reviewed field values used to create the deck in the user's Google Slides.
      required: [ category, clientName, fields ]
      properties:
        category:
          type: string
          maxLength: 255
          minLength: 1
          description: Market category or industry being analysed.
        clientName:
          type: string
          maxLength: 255
          minLength: 1
          description: Client the analysis is prepared for.
        fields:
          type: array
          maxItems: 200
          description: Final reviewed values for every template field.
          items:
            $ref: "#/components/schemas/StandardFieldValueV1"

    RndDecisionV1:
      type: string
      description: |
        Triage decision for an RnD request.
        ESCALATE_TO_RND — the buy meets or exceeds the escalation threshold; a drafted RnD submission summary is provided.
        WORKAROUND — the buy is below the threshold; a positive, relay-ready workaround response is provided instead of a "no".
      enum: [ ESCALATE_TO_RND, WORKAROUND ]

