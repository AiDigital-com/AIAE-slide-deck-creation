        googleConnected:
          type: boolean
          description: True when the authenticated user's Google account grants Drive/Slides access via Clerk SSO.
        googleStatus:
          description: Detailed Google connection state, so the UI can guide the user through re-consent.
          allOf:
            - $ref: "#/components/schemas/GoogleConnectionStatusV1"

